<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Registration App MVC</title>
<style>
 body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
      width: 300px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: 0.3s;
    }
    input:focus {
      border-color: #74ebd5;
      box-shadow: 0 0 5px #74ebd5;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background: #74ebd5;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #4bb3a7;
      color: white;
    }
    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<!DOCTYPE html>
<html>
<head>
  <title>Sign Up</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #74ebd5, #9face6);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    #userForm {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      text-align: left;
      margin: 10px 0 5px;
      font-weight: bold;
      color: #555;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #6c63ff;
      outline: none;
      box-shadow: 0 0 5px #6c63ff;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      background: #574b90;
    }

    .login-link {
      margin-top: 15px;
      display: block;
      text-decoration: none;
      color: #6c63ff;
      font-weight: bold;
      transition: 0.3s;
    }

    .login-link:hover {
      color: #333;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <form id="userForm" action="./Register" method="post">
    <h2>Sign Up</h2>

    <label for="name">Name:</label>
    <input type="text" name="name" required>

    <label for="city">City:</label>
    <input type="text" name="city" required>

    <label for="password">Password:</label>
    <input type="password" name="password" required minlength="6">

    <label for="email">Email:</label>
    <input type="email" name="email" required>

    <button type="submit">Register</button>

    <!-- Login button/link -->
    <a href="login.html" class="login-link">Already have an account? Login</a>
  </form>
</body>
</html>

</html>
