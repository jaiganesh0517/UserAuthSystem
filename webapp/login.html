<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<style>
 body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
      width: 300px;
    }
    h1 {
        text-align:centre;
        color:#333;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: 0.3s;
    }
    input:focus {
      border-color: #74ebd5;
      box-shadow: 0 0 5px #74ebd5;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background: #74ebd5;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #4bb3a7;
      color: white;
    }
    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>
   
   <form action="./LoginServlet" method="post">
        <h1>Enter Credential to Login</h1>
        <label for="email">EmailId:</label>
        <input type="email" name ="email" required>
        
        <label for="password">Password</label>
        <input type="password" name="password" required>
        
        <button type="submit">Submit</button>
        <div class="message" name="message"></div>
   
   </form>
</body>
</html>
